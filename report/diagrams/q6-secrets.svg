<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#374151;stroke-width:1.4}
      .lock{fill:#fefce8;stroke:#ca8a04;stroke-width:1.6}
      .k{fill:#eff6ff;stroke:#2563eb;stroke-width:1.6}
      .t{font-weight:bold;font-size:14px;fill:#111827}
      .s{font-size:12px;fill:#4b5563}
      .h{font-weight:bold;font-size:13px;fill:#374151}
      .l{stroke:#374151;stroke-width:1.4;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="20" y="26" class="h">Deployment secrets: SOPS + age, decrypted only inside the cluster</text>
  <rect x="20" y="40" width="200" height="74" rx="8" class="box"/>
  <text x="34" y="62" class="t">student laptop</text>
  <text x="34" y="80" class="s">sops --encrypt with the age</text>
  <text x="34" y="96" class="s">public key from .sops.yaml</text>
  <rect x="260" y="40" width="210" height="74" rx="8" class="lock"/>
  <text x="274" y="62" class="t">Git: *.sops.yaml</text>
  <text x="274" y="80" class="s">values: ENC[AES256_GCM,...]</text>
  <text x="274" y="96" class="s">names and keys stay readable</text>
  <rect x="510" y="40" width="210" height="74" rx="8" class="k"/>
  <text x="524" y="62" class="t">kustomize-controller</text>
  <text x="524" y="80" class="s">decrypts with flux-system/</text>
  <text x="524" y="96" class="s">sops-age (private key)</text>
  <rect x="760" y="40" width="180" height="74" rx="8" class="box"/>
  <text x="774" y="62" class="t">Secret objects</text>
  <text x="774" y="80" class="s">pg-credentials (sl-data)</text>
  <text x="774" y="96" class="s">shortlink-secrets (apps)</text>
  <path d="M220,77 H258" class="l"/><path d="M470,77 H508" class="l"/><path d="M720,77 H758" class="l"/>
  <rect x="560" y="140" width="380" height="80" rx="8" class="box"/>
  <text x="574" y="162" class="t">ShortLink pod (restricted PSS)</text>
  <text x="574" y="182" class="s">PGPASSWORD via secretKeyRef; admin token as a 0440 file</text>
  <text x="574" y="198" class="s">re-read per request (rotation without restart);</text>
  <text x="574" y="214" class="s">no service-account token; RBAC: no get on secrets</text>
  <path d="M850,114 V138" class="l"/>
  <text x="20" y="176" class="h">Pipeline secrets: GitHub Actions encrypted secrets</text>
  <rect x="20" y="190" width="280" height="74" rx="8" class="lock"/>
  <text x="34" y="212" class="t">repo secrets</text>
  <text x="34" y="230" class="s">CI_DB_PASSWORD, SMOKE_ADMIN_TOKEN</text>
  <text x="34" y="246" class="s">masked as *** in logs; GITHUB_TOKEN</text>
  <rect x="330" y="190" width="220" height="74" rx="8" class="box"/>
  <text x="344" y="212" class="t">jobs</text>
  <text x="344" y="230" class="s">integration DB, smoke test,</text>
  <text x="344" y="246" class="s">GHCR push (packages: write)</text>
  <path d="M300,227 H328" class="l"/>
  <rect x="20" y="280" width="530" height="40" rx="8" class="box"/>
  <text x="34" y="305" class="s">gitleaks gate: full Git history scanned on every run; local scan before every push</text>
</svg>
