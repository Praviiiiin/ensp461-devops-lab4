<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#374151;stroke-width:1.4}
      .gate{fill:#eff6ff;stroke:#2563eb;stroke-width:1.6}
      .out{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.6}
      .t{font-weight:bold;font-size:14px;fill:#111827}
      .s{font-size:12px;fill:#4b5563}
      .l{stroke:#374151;stroke-width:1.4;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <rect x="20" y="110" width="120" height="70" rx="8" class="box"/>
  <text x="34" y="138" class="t">git push</text>
  <text x="34" y="156" class="s">main / PR</text>
  <rect x="180" y="20" width="230" height="70" rx="8" class="gate"/>
  <text x="194" y="46" class="t">gate 1: lint + unit</text>
  <text x="194" y="64" class="s">ruff, 27 pytest tests,</text>
  <text x="194" y="80" class="s">coverage floor 80%</text>
  <rect x="180" y="110" width="230" height="70" rx="8" class="gate"/>
  <text x="194" y="136" class="t">gate 2: integration</text>
  <text x="194" y="154" class="s">4 tests vs postgres:17-alpine</text>
  <text x="194" y="170" class="s">service container, secret password</text>
  <rect x="180" y="200" width="230" height="70" rx="8" class="gate"/>
  <text x="194" y="226" class="t">gate 3: gitleaks</text>
  <text x="194" y="244" class="s">full history scan,</text>
  <text x="194" y="260" class="s">fails on any finding</text>
  <rect x="460" y="110" width="200" height="70" rx="8" class="box"/>
  <text x="474" y="136" class="t">build + push</text>
  <text x="474" y="154" class="s">ubuntu-24.04-arm, buildx</text>
  <text x="474" y="170" class="s">ghcr.io/.../shortlink-lab4</text>
  <rect x="710" y="110" width="230" height="70" rx="8" class="gate"/>
  <text x="724" y="136" class="t">deploy gate</text>
  <text x="724" y="154" class="s">env lab4-cluster: main only, 1 min</text>
  <text x="724" y="170" class="s">wait; smoke test image by digest</text>
  <rect x="710" y="210" width="230" height="60" rx="8" class="out"/>
  <text x="724" y="234" class="t">GitOps promotion</text>
  <text x="724" y="252" class="s">tag commit -> Flux -> Flagger</text>
  <path d="M140,140 C160,140 160,55 178,55" class="l"/>
  <path d="M140,145 H178" class="l"/>
  <path d="M140,150 C160,150 160,235 178,235" class="l"/>
  <path d="M410,55 C440,55 440,140 458,140" class="l"/>
  <path d="M410,145 H458" class="l"/>
  <path d="M410,235 C440,235 440,150 458,150" class="l"/>
  <path d="M660,145 H708" class="l"/>
  <path d="M825,180 V208" class="l"/>
  <text x="460" y="50" class="s">needs: all three gates</text>
  <text x="460" y="66" class="s">a red gate skips build and deploy</text>
</svg>
