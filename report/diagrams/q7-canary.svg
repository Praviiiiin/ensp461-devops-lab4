<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#374151;stroke-width:1.4}
      .blue{fill:#eff6ff;stroke:#2563eb;stroke-width:1.6}
      .orange{fill:#fff7ed;stroke:#ea580c;stroke-width:1.6}
      .red{fill:#fef2f2;stroke:#dc2626;stroke-width:1.6}
      .t{font-weight:bold;font-size:14px;fill:#111827}
      .s{font-size:12px;fill:#4b5563}
      .l{stroke:#374151;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .q{stroke:#2563eb;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#b)}
    </style>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <rect x="20" y="110" width="130" height="64" rx="8" class="box"/>
  <text x="34" y="136" class="t">users</text>
  <text x="34" y="154" class="s">canary.shortlink.test</text>
  <rect x="190" y="100" width="200" height="84" rx="8" class="box"/>
  <text x="204" y="124" class="t">Envoy Gateway</text>
  <text x="204" y="142" class="s">HTTPRoute written by Flagger</text>
  <text x="204" y="158" class="s">backendRefs weights</text>
  <text x="204" y="174" class="s">primary 100-w / canary w</text>
  <rect x="440" y="40" width="200" height="60" rx="8" class="blue"/>
  <text x="454" y="64" class="t">shortlink-primary</text>
  <text x="454" y="82" class="s">stable version, HPA 2-4</text>
  <rect x="440" y="180" width="200" height="60" rx="8" class="orange"/>
  <text x="454" y="204" class="t">shortlink (canary)</text>
  <text x="454" y="222" class="s">new version</text>
  <path d="M150,142 H188" class="l"/>
  <path d="M390,130 C415,130 415,70 438,70" class="l"/>
  <path d="M390,155 C415,155 415,210 438,210" class="l"/>
  <rect x="690" y="20" width="250" height="150" rx="8" class="box"/>
  <text x="704" y="44" class="t">Flagger loop (every 30 s)</text>
  <text x="704" y="66" class="s">w = 10, 20, 30, 40, 50 %</text>
  <text x="704" y="84" class="s">error-rate-percent &lt;= 1 (1 m window)</text>
  <text x="704" y="102" class="s">p95-latency-ms &lt;= 250 (1 m window)</text>
  <text x="704" y="120" class="s">pre-rollout acceptance webhook</text>
  <text x="704" y="138" class="s">rollout webhook: hey load on canary</text>
  <text x="704" y="156" class="s">pass at 50% -> promote to primary</text>
  <rect x="690" y="190" width="250" height="90" rx="8" class="red"/>
  <text x="704" y="214" class="t">rollback trigger</text>
  <text x="704" y="234" class="s">2 failed checks (threshold) -> w = 0,</text>
  <text x="704" y="252" class="s">canary scaled to 0, phase Failed;</text>
  <text x="704" y="270" class="s">progress deadline 300 s</text>
  <path d="M688,95 C665,95 665,70 642,70" class="l"/>
  <path d="M688,120 C665,120 665,205 642,205" class="l"/>
  <rect x="190" y="220" width="200" height="60" rx="8" class="box"/>
  <text x="204" y="244" class="t">Prometheus</text>
  <text x="204" y="262" class="s">shortlink_http_requests_total</text>
  <path d="M438,225 C415,225 415,250 392,250" class="l"/>
  <path d="M392,270 H672 V150 H688" class="q"/>
  <text x="430" y="290" class="s" fill="#2563eb">Flagger runs both MetricTemplate PromQL queries every 30 s</text>
</svg>
