# ShortLink CI/CD: every gate must pass before an image is published, and the
# published image must pass a smoke test plus a manual approval before it can be promoted.
name: ci

on:
  push:
    branches: [main]
    paths: [app/**, Dockerfile, .github/workflows/ci.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/praviiiiin/shortlink-lab4

jobs:
  unit:
    name: gate 1 - lint and unit tests
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: app/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -m "not integration" --cov --cov-report=term-missing --cov-fail-under=80 -q

  integration:
    name: gate 2 - integration tests (PostgreSQL)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shortlink
          POSTGRES_DB: shortlink
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U shortlink" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: shortlink
      PGDATABASE: shortlink
      PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: app/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -m integration -v

  secret-scan:
    name: gate 3 - gitleaks (full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --verbose

  build:
    name: build and push arm64 image
    needs: [unit, integration, secret-scan]
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read, packages: write }
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/pyproject.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-gate:
    name: deploy gate - smoke test pushed image + approval
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    environment: lab4-cluster
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shortlink
          POSTGRES_DB: shortlink
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        options: --health-cmd "pg_isready -U shortlink" --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - name: Run the exact pushed image (by digest) against PostgreSQL
        env:
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          ADMIN_TOKEN: ${{ secrets.SMOKE_ADMIN_TOKEN }}
          PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          umask 077; printf '%s' "$ADMIN_TOKEN" > "$RUNNER_TEMP/admin-token"; chmod 644 "$RUNNER_TEMP/admin-token"
          docker run -d --name smoke --network "${{ job.services.postgres.network }}" \
            -e PGHOST=postgres -e PGUSER=shortlink -e PGDATABASE=shortlink -e PGPASSWORD \
            -v "$RUNNER_TEMP/admin-token:/etc/shortlink/admin-token:ro" -p 8080:8080 "$REF"
          for i in $(seq 30); do curl -fs localhost:8080/readyz && break; sleep 1; done; echo
          code=$(curl -fs -XPOST localhost:8080/api/links -H 'Content-Type: application/json' \
            -d '{"url":"https://krmu.edu.in"}' | jq -r .code)
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/$code)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' -XDELETE localhost:8080/api/links/$code)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -XDELETE -H "Authorization: Bearer $ADMIN_TOKEN" localhost:8080/api/links/$code)" = 204
          curl -sI localhost:8080/healthz | grep -i x-shortlink-version
          echo "smoke test passed for $REF"
      - name: Promotion instructions
        run: |
          {
            echo "### Image ready for GitOps promotion"
            echo "\`${{ env.IMAGE }}:${{ needs.build.outputs.tag }}\`"
            echo "digest \`${{ needs.build.outputs.digest }}\`"
            echo "Promote by setting this tag in deploy/apps/*/kustomization.yaml; Flux reconciles the cluster."
          } >> "$GITHUB_STEP_SUMMARY"
