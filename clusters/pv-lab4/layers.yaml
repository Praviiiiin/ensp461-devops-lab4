# Reconciliation layers: controllers (Helm) -> their custom resources -> data tier -> apps.
# Every layer re-applies Git state every 2 minutes, so manual drift is reverted.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 2m
  path: ./infrastructure/controllers
  prune: true
  wait: true
  timeout: 10m
  sourceRef: { kind: GitRepository, name: flux-system }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn: [{ name: infra-controllers }]
  interval: 2m
  path: ./infrastructure/configs
  prune: true
  wait: true
  sourceRef: { kind: GitRepository, name: flux-system }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: data
  namespace: flux-system
spec:
  dependsOn: [{ name: infra-configs }]
  interval: 2m
  path: ./apps/data
  prune: true
  wait: true
  timeout: 5m
  sourceRef: { kind: GitRepository, name: flux-system }
  decryption: { provider: sops, secretRef: { name: sops-age } }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn: [{ name: data }]
  interval: 2m
  path: ./apps/workloads
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  decryption: { provider: sops, secretRef: { name: sops-age } }
