# The public GitHub repository is the single source of truth for the cluster.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/Praviiiiin/ensp461-devops-lab4.git
  ref:
    branch: main
  ignore: |
    /*
    !/clusters/
    !/infrastructure/
    !/apps/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/pv-lab4
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
