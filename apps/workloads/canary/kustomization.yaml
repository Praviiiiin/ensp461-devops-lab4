apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sl-canary
resources:
  - namespace.yaml
  - shortlink-secrets.sops.yaml
  - ../base
  - canary.yaml
images:
  - name: ghcr.io/praviiiiin/shortlink-lab4
    newTag: 2.1.0-fbefde2  # promotion = changing this line in Git
patches:
  - target: { kind: Deployment, name: shortlink }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: shortlink }
      spec:
        template:
          spec:
            containers:
              - name: shortlink
                env:
                  - { name: PGDATABASE, value: sl_canary }
