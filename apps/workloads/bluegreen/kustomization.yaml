apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sl-bg
resources:
  - namespace.yaml
  - shortlink-secrets.sops.yaml
  - ../base
  - canary.yaml
images:
  - name: ghcr.io/praviiiiin/shortlink-lab4
    newTag: 2.3.0-a4ce538  # promotion = changing this line in Git
patches:
  - target: { kind: Deployment, name: shortlink }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: shortlink }
      spec:
        template:
          spec:
            containers:
              - name: shortlink
                env:
                  - { name: PGDATABASE, value: sl_bg }
  # Rollback drill: the green build carries an injected fault (20% of user requests fail with 500).
  - target: { kind: Deployment, name: shortlink }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: shortlink }
      spec:
        template:
          spec:
            containers:
              - name: shortlink
                env:
                  - { name: APP_VERSION, value: 2.3.0-fault }
                  - { name: FAULT_ERROR_RATE, value: "0.2" }
