# Users of bluegreen.shortlink.test always go through the "shortlink" Service, whose
# selector Flagger flips between the blue (primary) and green (canary) pod sets.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: shortlink }
spec:
  parentRefs: [{ name: public, namespace: envoy-gateway-system }]
  hostnames: [bluegreen.shortlink.test]
  rules:
    - backendRefs: [{ name: shortlink, port: 80 }]
