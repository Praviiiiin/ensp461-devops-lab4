[project]
name = "shortlink"
version = "2.2.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: needs a real PostgreSQL"]

[tool.coverage.run]
source = ["shortlink"]
