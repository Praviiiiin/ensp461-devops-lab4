# Envoy Gateway implements the Kubernetes Gateway API; Flagger shifts HTTPRoute weights on it.
apiVersion: v1
kind: Namespace
metadata: { name: envoy-gateway-system }
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: { name: envoy-gateway, namespace: envoy-gateway-system }
spec:
  type: oci
  interval: 1h
  url: oci://docker.io/envoyproxy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: { name: envoy-gateway, namespace: envoy-gateway-system }
spec:
  interval: 30m
  chart:
    spec:
      chart: gateway-helm
      version: 1.10.0
      sourceRef: { kind: HelmRepository, name: envoy-gateway }
  install: { crds: CreateReplace }
  upgrade: { crds: CreateReplace }
