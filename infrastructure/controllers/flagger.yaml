# Flagger drives canary (Gateway API weights) and blue-green (Service switching) releases,
# judging each step with Prometheus queries against the application's own metrics.
apiVersion: v1
kind: Namespace
metadata: { name: flagger-system }
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: { name: flagger, namespace: flagger-system }
spec:
  interval: 1h
  url: https://flagger.app
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: { name: flagger, namespace: flagger-system }
spec:
  interval: 30m
  chart:
    spec:
      chart: flagger
      version: 1.45.0
      sourceRef: { kind: HelmRepository, name: flagger }
  install: { crds: CreateReplace }
  upgrade: { crds: CreateReplace }
  values:
    meshProvider: gatewayapi:v1
    metricsServer: http://prometheus-server.monitoring.svc
    clusterName: pv-lab4
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: { name: loadtester, namespace: flagger-system }
spec:
  interval: 30m
  chart:
    spec:
      chart: loadtester
      version: 0.39.0
      sourceRef: { kind: HelmRepository, name: flagger }
