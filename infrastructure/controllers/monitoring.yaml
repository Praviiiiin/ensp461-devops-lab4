# Prometheus scrapes annotated pods every 5s (Flagger analysis input); Grafana is read-only for anonymous viewers.
apiVersion: v1
kind: Namespace
metadata: { name: monitoring }
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: { name: prometheus-community, namespace: monitoring }
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: { name: grafana, namespace: monitoring }
spec:
  interval: 1h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: { name: prometheus, namespace: monitoring }
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus
      version: 30.0.1
      sourceRef: { kind: HelmRepository, name: prometheus-community }
  values:
    alertmanager: { enabled: false }
    prometheus-pushgateway: { enabled: false }
    prometheus-node-exporter: { enabled: false }
    kube-state-metrics: { enabled: false }
    server:
      global: { scrape_interval: 5s, evaluation_interval: 5s }
      retention: 7d
      persistentVolume: { size: 4Gi }
      service: { type: NodePort, nodePort: 30091 }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: { name: grafana, namespace: monitoring }
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana
      version: 10.5.15
      sourceRef: { kind: HelmRepository, name: grafana }
  values:
    service: { type: NodePort, nodePort: 30090 }
    grafana.ini:
      auth.anonymous: { enabled: true, org_role: Viewer }
      users: { default_theme: light }
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - { name: Prometheus, uid: prom, type: prometheus, url: "http://prometheus-server.monitoring.svc", isDefault: true }
    sidecar:
      dashboards: { enabled: true, label: grafana_dashboard, searchNamespace: monitoring }
---
# Resource metrics for the HorizontalPodAutoscalers that Flagger copies to the primaries.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: { name: metrics-server, namespace: monitoring }
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/metrics-server/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: { name: metrics-server, namespace: monitoring }
spec:
  interval: 30m
  targetNamespace: kube-system
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef: { kind: HelmRepository, name: metrics-server }
  values:
    args: [--kubelet-insecure-tls]  # kind kubelets use self-signed serving certificates
